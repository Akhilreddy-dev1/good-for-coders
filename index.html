const Toast = ({ msg }) => (

// ── OmniSearch modal ─────────────────────────────────────────────────────────
const OmniSearch = ({ items, query, setQuery, onClose }) => {
    const inputRef = useRef(null);
    useEffect(() => { setTimeout(() => inputRef.current?.focus(), 40); }, []);

    const results = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return items.slice(0, 6);
        return items.filter(i =>
            i.title.toLowerCase().includes(q) ||
            i.description.toLowerCase().includes(q) ||
            i.source.toLowerCase().includes(q) ||
            i.tags.some(t => t.toLowerCase().includes(q)) ||
            (i.snippet && i.snippet.toLowerCase().includes(q))
        );
    }, [items, query]);

    return (
        <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 bg-black/70 backdrop-blur-md px-4 animate-fadeIn"
            onClick={onClose}>
            <div className="glass-flat w-full max-w-xl rounded-3xl p-6 border border-pink-500/50 shadow-2xl animate-zoomIn"
                onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-4 border-b border-white/10 mb-4">
                    <div className="flex items-center space-x-2 text-pink-400">
                        <Icon name="search" cls="w-4 h-4" />
                        <span className="text-sm font-extrabold text-white">Omni-Search</span>
                    </div>
                    <button onClick={onClose}
                        className="text-xs font-bold text-slate-400 hover:text-white px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 transition">
                        ESC
                    </button>
                </div>
                <div className="relative mb-4">
                    <Icon name="search" cls="w-4 h-4 absolute left-3.5 top-3.5 text-pink-400 pointer-events-none" />
                    <input ref={inputRef} type="text" value={query} onChange={e => setQuery(e.target.value)}
                        placeholder="Search across all workspaces…"
                        className="input-field pl-10 pr-4 py-3" />
                    {query && (
                        <button onClick={() => setQuery('')}
                            className="absolute right-3.5 top-3 text-pink-400 hover:text-white transition">
                            <Icon name="x" cls="w-4 h-4" />
                        </button>
                    )}
                </div>
                <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                    {results.length === 0 ? (
                        <p className="text-xs text-slate-400 text-center py-8">No matching artifacts found.</p>
                    ) : results.map(item => (
                        <div key={item.id}
                            onClick={() => { setQuery(item.title); onClose(); }}
                            className="flex items-center justify-between p-3 rounded-2xl hover:bg-white/8 cursor-pointer transition border border-transparent hover:border-pink-500/25 group">
                            <div>
                                <p className="text-xs font-bold text-white group-hover:text-pink-200 transition">{item.title}</p>
                                <p className="text-[10px] text-slate-400 mt-0.5">{item.source} · {item.category}</p>
                            </div>
                            <span className="text-[10px] font-mono text-pink-400 bg-pink-500/10 px-2 py-0.5 rounded-full border border-pink-500/20 flex-shrink-0">Open</span>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    );
};

// ── AddItem modal ────────────────────────────────────────────────────────────
const AddItemModal = ({ onClose, onAdd }) => {
    const [title, setTitle]       = useState('');
    const [category, setCategory] = useState('coders');
    const [source, setSource]     = useState('');
    const [description, setDesc]  = useState('');
    const [snippet, setSnippet]   = useState('');
    const [tags, setTags]         = useState('');
    const [image, setImage]       = useState('');
    const [error, setError]       = useState('');

    const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) { setError('Artifact title is required.'); return; }
        setError('');
        const newItem = {
            id: 'ctx-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
            title: title.trim(),
            category,
            source: source.trim() || 'Manual Entry',
            image: image.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80',
            snippet: snippet.trim(),
            description: description.trim() || 'No description provided.',
            metadata: 'Created: Just now',
            favorite: false,
            tags: tags ? tags.split(',').map(t => {
                const c = t.trim();
                return c.startsWith('#') ? c : '#' + c;
            }).filter(t => t.length > 1) : ['#Custom']
        };
        onAdd(newItem);
    };

    const labelCls = "block text-[11px] font-extrabold uppercase tracking-widest text-pink-400 mb-1.5";
    const catOptions = [
        { value: 'coders',   label: 'Coders Workspace' },
        { value: 'creators', label: 'Creators Vault' },
        { value: 'leaders',  label: 'Executive Suite' },
    ];

    return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md animate-fadeIn"
            onClick={onClose}>
            <div className="glass-flat w-full max-w-lg rounded-3xl p-6 border border-pink-500/50 shadow-2xl overflow-y-auto max-h-[92vh] animate-zoomIn"
                onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-4 border-b border-white/10 mb-5">
                    <div className="flex items-center space-x-2.5">
                        <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center shadow-lg">
                            <Icon name="sparkles" cls="w-4 h-4 text-white" />
                        </div>
                        <span className="text-sm font-extrabold text-white">Add Context Artifact</span>
                    </div>
                    <button onClick={onClose}
                        className="p-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition">
                        <Icon name="x" cls="w-4 h-4" />
                    </button>
                </div>

                {error && (
                    <div className="mb-4 px-4 py-3 bg-red-500/15 border border-red-500/40 rounded-xl text-red-300 text-xs font-semibold">
                        {error}
                    </div>
                )}

                <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                        <label className={labelCls}>Title *</label>
                        <input type="text" value={title} onChange={e => setTitle(e.target.value)}
                            placeholder="e.g. JWT Auth Middleware" className="input-field" />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className={labelCls}>Workspace</label>
                            <select value={category} onChange={e => setCategory(e.target.value)}
                                className="input-field" style={{cursor:'pointer'}}>
                                {catOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className={labelCls}>Source</label>
                            <input type="text" value={source} onChange={e => setSource(e.target.value)}
                                placeholder="GitHub, Notion…" className="input-field" />
                        </div>
                    </div>
                    <div>
                        <label className={labelCls}>Description</label>
                        <textarea rows="2" value={description} onChange={e => setDesc(e.target.value)}
                            placeholder="Brief summary…" className="input-field" />
                    </div>
                    <div>
                        <label className={labelCls}>Code / Snippet</label>
                        <textarea rows="3" value={snippet} onChange={e => setSnippet(e.target.value)}
                            placeholder="const token = req.headers.authorization;"
                            className="input-field code-font text-pink-200" style={{fontSize:'12px'}} />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className={labelCls}>Tags (comma-separated)</label>
                            <input type="text" value={tags} onChange={e => setTags(e.target.value)}
                                placeholder="#Auth, #Security" className="input-field" />
                        </div>
                        <div>
                            <label className={labelCls}>Image URL</label>
                            <input type="text" value={image} onChange={e => setImage(e.target.value)}
                                placeholder="https://…" className="input-field" />
                        </div>
                    </div>
                    <div className="flex justify-end space-x-3 pt-2">
                        <button type="button" onClick={onClose}
                            className="px-4 py-2 rounded-xl text-xs font-bold bg-white/5 text-slate-300 hover:bg-white/10 transition">
                            Cancel
                        </button>
                        <button type="submit"
                            className="px-5 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white shadow-lg shadow-pink-600/35 transition flex items-center space-x-1.5">
                            <Icon name="plus" cls="w-3.5 h-3.5" />
                            <span>Index Artifact</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    );
};

                    style={{background:'rgba(15,10,40,0.8)'}}>
                    <Icon name="search" cls="w-4 h-4 text-pink-400" />
                    <span className="hidden md:inline font-semibold">Search</span>
                    <kbd className="hidden md:inline-block text-[10px] font-mono px-1.5 py-0.5 rounded border border-white/15 text-pink-300"

                {/* Avatar */}
                <div className="flex items-center space-x-2.5">
                    <div className="relative">

                            className="w-9 h-9 rounded-xl border-2 object-cover"
                            style={{borderColor:'rgba(236,72,153,0.6)'}}

                        <span className="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2"

                    <div className="hidden lg:block text-left">

);

        { id:'coders',   label:'Coders Workspace',  icon:'code',        color:'text-cyan-400',
          activeBg:'linear-gradient(135deg,rgba(8,145,178,0.28),rgba(37,99,235,0.28))',   activeBorder:'rgba(6,182,212,0.5)' },
        { id:'creators', label:'Creators Vault',    icon:'video',       color:'text-rose-400',

            <div className="glass-flat rounded-3xl p-4 shadow-xl">
                <div className="flex items-center space-x-2 px-2 mb-3">
                    <Icon name="layers" cls="w-3.5 h-3.5 text-pink-400" />
                    <span className="text-[10px] font-extrabold uppercase tracking-widest text-pink-400">Workspaces</span>
                </div>
                <nav className="space-y-1.5">
                    {tabs.map(tab => {

                                </div>
                                <span className="text-[11px] font-mono font-bold px-2 py-0.5 rounded-full"

                style={{background:'linear-gradient(135deg,rgba(49,8,99,0.45),rgba(3,0,20,0.7),rgba(80,7,36,0.35))'}}>
                <div className="flex items-center space-x-2 mb-3">
                    <Icon name="cpu" cls="w-3.5 h-3.5 text-pink-400 animate-spin" />
                    <span className="text-[10px] font-black uppercase tracking-widest"
                        style={{background:'linear-gradient(to right,#f9a8d4,#d8b4fe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
                        Neural Sync Active
                    </span>
                </div>
                <p className="text-xs text-slate-400 leading-relaxed mb-4">
                    Live semantic indexing across GitHub, Drive, Notion &amp; Slack.

                    <div className="h-full w-full rounded-full animate-pulse"
                        style={{background:'linear-gradient(to right,#ec4899,#a855f7,#22d3ee)'}}></div>
                </div>
                <div className="flex justify-between mt-2.5 text-[10px] font-mono font-semibold text-slate-500">

                    <span className="text-emerald-400 flex items-center space-x-1">

};


// ── ArtifactCard component ───────────────────────────────────────────────────
const CATEGORY_META = {
    coders:   { icon:'code',      badge:'bg-cyan-500/15 text-cyan-300 border-cyan-500/40' },
    creators: { icon:'video',     badge:'bg-rose-500/15 text-rose-300 border-rose-500/40' },
    leaders:  { icon:'briefcase', badge:'bg-amber-500/15 text-amber-300 border-amber-500/40' },
};

const ArtifactCard = ({ item, onToggleFav, onDelete, onCopy }) => {
    const meta = CATEGORY_META[item.category] || CATEGORY_META.coders;

    return (
        <div className="glass-card rounded-3xl p-5 flex flex-col justify-between relative group overflow-hidden animate-slideUp">
            {/* Card header row */}
            <div className="flex items-start justify-between mb-3 gap-2">
                <span className={`inline-flex items-center space-x-1.5 text-[10px] font-extrabold uppercase tracking-wide px-2.5 py-1.5 rounded-xl border ${meta.badge}`}>
                    <Icon name={meta.icon} cls="w-3 h-3" />
                    <span>{item.category} · {item.source}</span>
                </span>
                <div className="flex items-center space-x-1.5 flex-shrink-0">
                    <button onClick={() => onToggleFav(item.id)}
                        title="Toggle favourite"
                        className={`p-1.5 rounded-xl border transition ${item.favorite
                            ? 'bg-amber-500/25 border-amber-500/55 text-amber-300 shadow shadow-amber-500/20'
                            : 'bg-white/5 border-white/10 text-slate-500 hover:text-amber-300'}`}>
                        <svg xmlns="http://www.w3.org/2000/svg" className="w-3.5 h-3.5" viewBox="0 0 24 24"
                            fill={item.favorite ? 'currentColor' : 'none'}
                            stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </button>
                    <button onClick={() => onDelete(item.id)}
                        title="Delete artifact"
                        className="p-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-500 hover:text-pink-400 hover:border-pink-500/40 transition opacity-0 group-hover:opacity-100">
                        <Icon name="trash-2" cls="w-3.5 h-3.5" />
                    </button>
                </div>
            </div>

            {/* Title + description */}
            <h4 className="font-extrabold text-white text-[15px] leading-tight mb-1.5 tracking-tight">{item.title}</h4>
            <p className="text-xs text-slate-400 mb-3 line-clamp-2 leading-relaxed">{item.description}</p>

            {/* Image preview */}
            {item.image && (
                <div className="relative mb-3 rounded-2xl overflow-hidden border border-white/12 h-32 group/img">
                    <img src={item.image} alt={item.title}
                        className="w-full h-full object-cover group-hover/img:scale-105 transition duration-500" />
                    <div className="absolute inset-0 pointer-events-none"
                        style={{background:'linear-gradient(to top,rgba(3,0,20,0.75),transparent)'}}></div>
                    <span className="absolute bottom-2 left-2.5 text-[9px] font-bold text-white flex items-center space-x-1 px-2 py-0.5 rounded-lg"
                        style={{background:'rgba(0,0,0,0.55)', backdropFilter:'blur(6px)', border:'1px solid rgba(255,255,255,0.15)'}}>
                        <Icon name="image" cls="w-2.5 h-2.5 text-pink-400" />
                        <span>Preview</span>
                    </span>
                </div>
            )}

            {/* Code snippet */}
            {item.snippet && (
                <div className="rounded-2xl p-3.5 mb-3 overflow-x-auto max-h-24 code-font text-xs text-pink-200 border border-white/8"
                    style={{background:'rgba(2,6,23,0.85)'}}>
                    <pre className="whitespace-pre-wrap break-words leading-relaxed">{item.snippet}</pre>
                </div>
            )}

            {/* Tags */}
            {item.tags && item.tags.length > 0 && (
                <div className="flex flex-wrap gap-1.5 mb-3">
                    {item.tags.map((tag, i) => (
                        <span key={i} className="code-font text-[10px] font-bold px-2 py-0.5 rounded-lg border text-pink-300"
                            style={{background:'rgba(236,72,153,0.1)', borderColor:'rgba(236,72,153,0.25)'}}>
                            {tag}
                        </span>
                    ))}
                </div>
            )}

            {/* Footer */}
            <div className="flex items-center justify-between pt-3.5 border-t border-white/8 mt-auto">
                <span className="text-[11px] text-slate-500 font-mono">{item.metadata}</span>
                <button onClick={() => onCopy(item)}
                    className="flex items-center space-x-1.5 text-white text-[11px] font-bold px-3.5 py-1.5 rounded-xl transition shadow shadow-pink-600/30 hover:shadow-pink-500/50"
                    style={{background:'linear-gradient(135deg,#db2777,#7c3aed)'}}>
                    <span>Copy</span>
                    <Icon name="copy" cls="w-3 h-3" />
                </button>
            </div>
        </div>
    );
};

// ── App root ─────────────────────────────────────────────────────────────────
function App() {
    const [items, setItems] = useState(() => {
        try {
            const s = localStorage.getItem('contextpulse_v5_items');
            if (s) { const p = JSON.parse(s); if (Array.isArray(p)) return p; }
        } catch {}
        return INITIAL_ITEMS;
    });

    const [activeTab,   setActiveTab]   = useState('all');
    const [searchQuery, setSearchQuery] = useState('');
    const [omniOpen,    setOmniOpen]    = useState(false);
    const [addOpen,     setAddOpen]     = useState(false);
    const [toast,       setToast]       = useState(null);

    // Persist to localStorage
    useEffect(() => {
        try { localStorage.setItem('contextpulse_v5_items', JSON.stringify(items)); } catch {}
    }, [items]);

    // Keyboard shortcuts
    useEffect(() => {
        const handler = (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                setOmniOpen(p => !p);
            }
            if (e.key === 'Escape') { setOmniOpen(false); setAddOpen(false); }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
    }, []);

    const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3200);
    }, []);

    const toggleFav = useCallback((id) => {
        setItems(prev => prev.map(i => i.id === id ? { ...i, favorite: !i.favorite } : i));
        showToast('⭐ Favourite toggled');
    }, [showToast]);

    const deleteItem = useCallback((id) => {
        setItems(prev => prev.filter(i => i.id !== id));
        showToast('🗑️ Artifact deleted');
    }, [showToast]);

    const addItem = useCallback((item) => {
        setItems(prev => [item, ...prev]);
        setAddOpen(false);
        showToast('✨ Artifact indexed successfully!');
    }, [showToast]);

    const copyItem = useCallback((item) => {
        try {
            navigator.clipboard.writeText(item.snippet || item.title);
            showToast(`📋 Copied "${item.title}"`);
        } catch {
            showToast('⚠️ Clipboard access unavailable');
        }
    }, [showToast]);

    const filtered = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return items.filter(item => {
            const matchTab = activeTab === 'all' || item.category === activeTab;
            const matchQ   = !q
                || item.title.toLowerCase().includes(q)
                || item.description.toLowerCase().includes(q)
                || item.source.toLowerCase().includes(q)
                || item.tags.some(t => t.toLowerCase().includes(q))
                || (item.snippet && item.snippet.toLowerCase().includes(q));
            return matchTab && matchQ;
        });
    }, [items, activeTab, searchQuery]);

    const feedLabel = activeTab === 'all'
        ? 'All Workspace Streams'
        : { coders:'Coders Workspace', creators:'Creators Vault', leaders:'Executive Suite' }[activeTab];

    return (
        <div className="min-h-screen flex flex-col text-slate-100">
            {toast && <Toast msg={toast} />}
            {omniOpen && <OmniSearch items={items} query={searchQuery} setQuery={setSearchQuery} onClose={() => setOmniOpen(false)} />}
            {addOpen  && <AddItemModal onClose={() => setAddOpen(false)} onAdd={addItem} />}

            <Header onAddClick={() => setAddOpen(true)} onSearchClick={() => setOmniOpen(true)} />

            <main className="flex-1 max-w-7xl w-full mx-auto px-5 py-7 grid grid-cols-1 lg:grid-cols-4 gap-7">
                <Sidebar items={items} activeTab={activeTab} setActiveTab={setActiveTab} />

                {/* Content area */}
                <section className="lg:col-span-3 space-y-6">

                    {/* Hero search banner */}
                    <div className="glass-flat rounded-3xl p-7 relative overflow-hidden border border-pink-500/30">
                        <div className="absolute -right-16 -top-16 w-56 h-56 rounded-full pointer-events-none"
                            style={{background:'radial-gradient(circle,rgba(236,72,153,0.28),rgba(168,85,247,0.12),transparent)',filter:'blur(40px)'}}></div>
                        <h2 className="text-2xl font-black tracking-tight mb-1.5"
                            style={{background:'linear-gradient(to right,#fff,#f9a8d4,#d8b4fe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
                            Infinite Context Engine
                        </h2>
                        <p className="text-slate-400 text-sm mb-5 font-medium max-w-lg">
                            Instant neural retrieval across your complete digital workspace.
                        </p>
                        <div className="relative">
                            <Icon name="search" cls="w-4 h-4 absolute left-4 top-3.5 text-pink-400 pointer-events-none" />
                            <input type="text" value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                placeholder="Search by title, tag, keyword, or platform…"
                                className="input-field pl-11 pr-16 py-3.5 text-sm rounded-2xl" />
                            {searchQuery && (
                                <button onClick={() => setSearchQuery('')}
                                    className="absolute right-4 top-3.5 text-xs font-bold text-pink-400 hover:text-white transition">
                                    Clear
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Feed label */}
                    <div className="flex items-center justify-between px-1">
                        <h3 className="text-sm font-extrabold text-slate-200 flex items-center space-x-2">
                            <span className="w-2 h-2 rounded-full"
                                style={{background:'linear-gradient(to right,#f472b6,#a78bfa)'}}></span>
                            <span>{feedLabel}</span>
                        </h3>
                        <span className="text-[11px] font-mono font-bold px-3 py-1 rounded-full border text-pink-300"
                            style={{background:'rgba(236,72,153,0.08)', borderColor:'rgba(236,72,153,0.25)'}}>
                            {filtered.length} artifact{filtered.length !== 1 ? 's' : ''}
                        </span>
                    </div>

                    {/* Grid or empty state */}
                    {filtered.length === 0 ? (
                        <div className="glass-flat rounded-3xl p-14 text-center border border-dashed border-pink-500/25">
                            <Icon name="folder-open" cls="w-12 h-12 mx-auto mb-3 text-pink-400/50" />
                            <p className="text-sm font-bold text-slate-300">No artifacts found</p>
                            <p className="text-xs text-slate-500 mt-1">Try a different search or add a new artifact.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            {filtered.map(item => (
                                <ArtifactCard key={item.id} item={item}
                                    onToggleFav={toggleFav}
                                    onDelete={deleteItem}
                                    onCopy={copyItem} />
                            ))}
                        </div>
                    )}
                </section>
            </main>
        </div>
    );
}

// ── Mount with React 18 createRoot ───────────────────────────────────────────
const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
