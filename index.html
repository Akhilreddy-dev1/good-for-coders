<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#030014;color:#f8fafc;overflow-x:hidden;min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}

/* Glass */
.glass{
  background:linear-gradient(135deg,rgba(20,18,50,0.88),rgba(10,8,30,0.96));
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(236,72,153,0.2);
  box-shadow:0 16px 48px rgba(0,0,0,0.55);
}
.glass-card{
  background:linear-gradient(135deg,rgba(20,18,50,0.88),rgba(10,8,30,0.96));
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(236,72,153,0.18);
  box-shadow:0 16px 48px rgba(0,0,0,0.55);
  border-radius:22px;
  transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
}
.glass-card:hover{
  border-color:rgba(236,72,153,0.55);
  box-shadow:0 28px 64px rgba(236,72,153,0.18),0 8px 24px rgba(0,0,0,0.5);
  transform:translateY(-4px);
}

/* Fields */
.field{
  width:100%;
  background:rgba(2,6,23,0.92);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;
  padding:9px 14px;
  font-size:13px;
  color:#f1f5f9;
  outline:none;
  transition:border-color 0.2s;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.field:focus{border-color:rgba(236,72,153,0.65);}
select.field{cursor:pointer;}
textarea.field{resize:vertical;}

/* Text clamp */
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* Overlays */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,0.78);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  animation:fadeOv 0.2s ease both;
}
.overlay-top{align-items:flex-start;padding-top:72px;}

/* Ambient orbs */
.orb{position:fixed;pointer-events:none;z-index:0;border-radius:9999px;}
.orb1{top:-12%;left:4%;width:620px;height:620px;background:radial-gradient(circle,rgba(168,85,247,0.38),transparent 70%);filter:blur(90px);animation:f1 13s ease-in-out infinite;}
.orb2{top:28%;right:-2%;width:720px;height:720px;background:radial-gradient(circle,rgba(236,72,153,0.3),transparent 70%);filter:blur(100px);animation:f2 17s ease-in-out infinite;}
.orb3{bottom:-12%;left:22%;width:680px;height:680px;background:radial-gradient(circle,rgba(6,182,212,0.22),transparent 70%);filter:blur(110px);animation:f3 21s ease-in-out infinite;}

@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(55px,-75px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-65px,55px)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(45px,65px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(0.93)}to{opacity:1;transform:scale(1)}}
@keyframes fadeOv{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes dot1{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
@keyframes dot2{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
@keyframes dot3{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}

.anim-slide-up{animation:slideUp 0.3s ease both;}
.anim-pop-in{animation:popIn 0.28s cubic-bezier(0.16,1,0.3,1) both;}

/* Scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(236,72,153,0.28);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(236,72,153,0.55);}

/* Responsive grid */
.main-grid{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:24px;
}
.cards-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
@media(max-width:1024px){
  .main-grid{grid-template-columns:1fr;}
  .sidebar-aside{display:none;}
}
@media(max-width:640px){
  .cards-grid{grid-template-columns:1fr;}
}

/* Tag badge */
.tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:700;
  padding:2px 9px;border-radius:6px;
  background:rgba(236,72,153,0.1);
  border:1px solid rgba(236,72,153,0.22);
  color:#f472b6;
  display:inline-block;
}

/* Gradient text */
.grad-text{
  background:linear-gradient(to right,#fff,#f9a8d4,#d8b4fe);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
</style>
</head>

/* â”€â”€â”€ Seed Data â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */

/* â”€â”€â”€ Toast â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function Toast({msg}){
  return (
    <div className="anim-slide-up" style={{
      position:'fixed',bottom:28,right:28,zIndex:200,
      display:'flex',alignItems:'center',gap:10,
      padding:'11px 18px',borderRadius:14,
      background:'linear-gradient(135deg,rgba(88,28,135,0.97),rgba(157,23,77,0.97))',

}

/* â”€â”€â”€ OmniSearch â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function OmniSearch({items, query, setQuery, onClose, onSelect}){
  const inputRef = useRef(null);
  useEffect(()=>{ setTimeout(()=>inputRef.current&&inputRef.current.focus(), 40); },[]);

  const results = useMemo(()=>{
    const q = query.trim().toLowerCase();
    if(!q) return items.slice(0,7);
    return items.filter(i=>(
      i.title.toLowerCase().includes(q) ||
      i.description.toLowerCase().includes(q) ||
      i.source.toLowerCase().includes(q) ||
      (i.snippet && i.snippet.toLowerCase().includes(q)) ||
      i.tags.some(t=>t.toLowerCase().includes(q))
    ));
  },[items,query]);

  function pick(item){
    setQuery('');   /* clear search so "all" cards show, then highlight */
    onSelect(item);
    onClose();
  }

  return (
    <div className="overlay overlay-top" onClick={onClose}>
      <div className="glass anim-pop-in" onClick={e=>e.stopPropagation()} style={{
        width:'100%',maxWidth:560,borderRadius:24,padding:22,
        border:'1px solid rgba(236,72,153,0.45)',
      }}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:14,borderBottom:'1px solid rgba(255,255,255,0.08)',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {IC.search({...SZ.sm,color:'#f472b6'})}
            <span style={{fontWeight:800,fontSize:14,color:'#fff'}}>Omni Search</span>
          </div>
          <button onClick={onClose} style={{fontSize:11,fontWeight:700,color:'#94a3b8',padding:'3px 10px',borderRadius:8,background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',cursor:'pointer'}}>ESC</button>
        </div>
        <div style={{position:'relative',marginBottom:12}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',display:'flex'}}>
            {IC.search({...SZ.sm,color:'#f472b6'})}
          </span>
          <input ref={inputRef} type="text" value={query} onChange={e=>setQuery(e.target.value)}
            placeholder="Search title, tag, keyword, sourceâ€¦"
            className="field" style={{paddingLeft:36}}/>
        </div>
        <div style={{maxHeight:280,overflowY:'auto',display:'flex',flexDirection:'column',gap:3}}>
          {results.length===0
            ? <p style={{textAlign:'center',color:'#475569',fontSize:12,padding:'28px 0'}}>No results found.</p>
            : results.map(item=>(
              <button key={item.id} onClick={()=>pick(item)} style={{
                display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'10px 12px',borderRadius:12,cursor:'pointer',
                border:'1px solid transparent',background:'transparent',
                textAlign:'left',width:'100%',transition:'all 0.15s',
              }}
              onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.05)';e.currentTarget.style.borderColor='rgba(236,72,153,0.2)';}}
              onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='transparent';}}>
                <div>
                  <p style={{fontWeight:700,fontSize:12,color:'#f1f5f9'}}>{item.title}</p>
                  <p style={{fontSize:10,color:'#64748b',marginTop:2}}>{item.source} Â· {item.category}</p>
                </div>
                <span style={{fontSize:10,fontFamily:'monospace',color:'#f472b6',background:'rgba(236,72,153,0.1)',padding:'2px 8px',borderRadius:20,border:'1px solid rgba(236,72,153,0.2)',flexShrink:0,marginLeft:8}}>View</span>
              </button>
            ))
          }
        </div>
      </div>
    </div>
  );
}

/* â”€â”€â”€ AddItemModal â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function AddItemModal({onClose, onAdd}){
  const [title,  setTitle]  = useState('');
  const [cat,    setCat]    = useState('coders');
  const [source, setSource] = useState('');
  const [desc,   setDesc]   = useState('');
  const [snippet,setSnippet]= useState('');
  const [tags,   setTags]   = useState('');
  const [image,  setImage]  = useState('');
  const [err,    setErr]    = useState('');

  function submit(e){
    e.preventDefault();
    if(!title.trim()){ setErr('Title is required.'); return; }
    setErr('');
    const parsedTags = tags
      ? tags.split(',').map(t=>{ const c=t.trim(); return c.startsWith('#')?c:'#'+c; }).filter(t=>t.length>1)
      : ['#Custom'];
    onAdd({
      id: 'ctx-' + Date.now(),
      title: title.trim(), category: cat,
      source: source.trim() || 'Manual Entry',
      image:  image.trim()  || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80',
      snippet: snippet.trim(),
      description: desc.trim() || 'No description provided.',
      metadata: 'Created: Just now',
      favorite: false, tags: parsedTags,
    });
  }

  const lbl = {display:'block',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.08em',color:'#f472b6',marginBottom:5};

  return (
    <div className="overlay" onClick={onClose}>
      <div className="glass anim-pop-in" onClick={e=>e.stopPropagation()} style={{
        width:'100%',maxWidth:500,borderRadius:24,padding:24,
        border:'1px solid rgba(236,72,153,0.38)',
        maxHeight:'92vh',overflowY:'auto',
      }}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:16,borderBottom:'1px solid rgba(255,255,255,0.08)',marginBottom:18}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,borderRadius:11,background:'linear-gradient(135deg,#ec4899,#7c3aed)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              {IC.sparkle({...SZ.sm,color:'#fff'})}
            </div>
            <span style={{fontWeight:800,fontSize:14,color:'#fff'}}>Add Context Artifact</span>
          </div>
          <button onClick={onClose} style={{padding:6,borderRadius:10,background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',cursor:'pointer',color:'#94a3b8',display:'flex'}}>
            {IC.x(SZ.md)}
          </button>
        </div>

        {err && (
          <div style={{marginBottom:14,padding:'9px 14px',background:'rgba(239,68,68,0.12)',border:'1px solid rgba(239,68,68,0.35)',borderRadius:10,color:'#fca5a5',fontSize:12,fontWeight:600}}>
            {err}
          </div>
        )}

        <form onSubmit={submit}>
          <div style={{marginBottom:13}}>
            <label style={lbl}>Title *</label>
            <input type="text" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. JWT Auth Middleware" className="field"/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:13}}>
            <div>
              <label style={lbl}>Workspace</label>
              <select value={cat} onChange={e=>setCat(e.target.value)} className="field">
                <option value="coders">Coders</option>
                <option value="creators">Creators</option>
                <option value="leaders">Leaders</option>
              </select>
            </div>
            <div>
              <label style={lbl}>Source</label>
              <input type="text" value={source} onChange={e=>setSource(e.target.value)} placeholder="GitHub, Notionâ€¦" className="field"/>
            </div>
          </div>
          <div style={{marginBottom:13}}>
            <label style={lbl}>Description</label>
            <textarea rows="2" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Brief summaryâ€¦" className="field"/>
          </div>
          <div style={{marginBottom:13}}>
            <label style={lbl}>Code / Snippet</label>
            <textarea rows="4" value={snippet} onChange={e=>setSnippet(e.target.value)} placeholder="const token = req.headers.authorization;" className="field mono" style={{fontSize:12,color:'#f9a8d4'}}/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
            <div>
              <label style={lbl}>Tags (comma-separated)</label>
              <input type="text" value={tags} onChange={e=>setTags(e.target.value)} placeholder="#Auth, #Security" className="field"/>
            </div>
            <div>
              <label style={lbl}>Image URL</label>
              <input type="text" value={image} onChange={e=>setImage(e.target.value)} placeholder="https://â€¦" className="field"/>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
            <button type="button" onClick={onClose} style={{padding:'8px 16px',borderRadius:10,fontSize:12,fontWeight:700,background:'rgba(255,255,255,0.05)',color:'#94a3b8',border:'1px solid rgba(255,255,255,0.08)',cursor:'pointer'}}>
              Cancel
            </button>
            <button type="submit" style={{padding:'8px 18px',borderRadius:10,fontSize:12,fontWeight:700,background:'linear-gradient(135deg,#db2777,#7c3aed)',color:'#fff',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:6,boxShadow:'0 4px 16px rgba(219,39,119,0.35)'}}>
              {IC.plus({...SZ.sm,color:'#fff'})} Index Artifact
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}


/* â”€â”€â”€ Header â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */

            <img

/* â”€â”€â”€ Sidebar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
const TABS = [
  {id:'all',      label:'All Streams',       icon:IC.grid,  activeGrad:'linear-gradient(135deg,rgba(219,39,119,0.22),rgba(124,58,237,0.22))', activeBdr:'rgba(236,72,153,0.45)'},
  {id:'coders',   label:'Coders Workspace',  icon:IC.code,  activeGrad:'linear-gradient(135deg,rgba(8,145,178,0.22),rgba(37,99,235,0.22))',   activeBdr:'rgba(6,182,212,0.45)'},
  {id:'creators', label:'Creators Vault',    icon:IC.video, activeGrad:'linear-gradient(135deg,rgba(225,29,72,0.22),rgba(219,39,119,0.22))',   activeBdr:'rgba(244,63,94,0.45)'},
  {id:'leaders',  label:'Executive Suite',   icon:IC.brief, activeGrad:'linear-gradient(135deg,rgba(217,119,6,0.22),rgba(234,88,12,0.22))',    activeBdr:'rgba(245,158,11,0.45)'},
];

function Sidebar({items, active, setActive}){
  return (
    <aside className="sidebar-aside" style={{display:'flex',flexDirection:'column',gap:16}}>
      {/* Workspace nav */}
      <div className="glass" style={{borderRadius:22,padding:14}}>
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'0 4px',marginBottom:10}}>
          {IC.layers({...SZ.sm,color:'#f472b6'})}
          <span style={{fontSize:10,fontWeight:900,textTransform:'uppercase',letterSpacing:'0.08em',color:'#f472b6'}}>Workspaces</span>
        </div>
        <nav style={{display:'flex',flexDirection:'column',gap:4}}>
          {TABS.map(tab=>{
            const on = active === tab.id;
            const cnt = tab.id==='all' ? items.length : items.filter(i=>i.category===tab.id).length;
            return (
              <button key={tab.id} onClick={()=>setActive(tab.id)} style={{
                width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'9px 12px',borderRadius:13,
                background: on ? tab.activeGrad : 'transparent',
                border: on ? '1px solid '+tab.activeBdr : '1px solid transparent',
                color: on ? '#fff' : '#94a3b8',
                cursor:'pointer',transition:'all 0.15s',fontFamily:'inherit',
              }}
              onMouseEnter={e=>{ if(!on){ e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='#e2e8f0'; }}}
              onMouseLeave={e=>{ if(!on){ e.currentTarget.style.background='transparent'; e.currentTarget.style.color='#94a3b8'; }}}>
                <div style={{display:'flex',alignItems:'center',gap:9}}>
                  {tab.icon({...SZ.md,color:'currentColor'})}
                  <span style={{fontSize:13,fontWeight:600}}>{tab.label}</span>
                </div>
                <span style={{fontSize:11,fontFamily:'monospace',fontWeight:700,padding:'1px 7px',borderRadius:20,background:'rgba(255,255,255,0.07)',color:'#e2e8f0',flexShrink:0}}>
                  {cnt}
                </span>
              </button>
            );
          })}
        </nav>
      </div>

      {/* Neural Sync widget */}
      <div style={{borderRadius:22,padding:16,background:'linear-gradient(135deg,rgba(49,8,99,0.5),rgba(3,0,20,0.75),rgba(80,7,36,0.4))',border:'1px solid rgba(236,72,153,0.16)'}}>
        <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:8}}>
          {IC.cpu({...SZ.sm,color:'#f472b6'})}
          <span style={{fontSize:10,fontWeight:900,textTransform:'uppercase',letterSpacing:'0.08em',background:'linear-gradient(to right,#f9a8d4,#d8b4fe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
            Neural Sync Active
          </span>
        </div>
        <p style={{fontSize:11,color:'#475569',lineHeight:1.6,marginBottom:10}}>
          Live indexing across GitHub, Drive, Notion and Slack.
        </p>
        <div style={{width:'100%',height:5,borderRadius:3,background:'rgba(15,10,40,0.8)',overflow:'hidden'}}>
          <div style={{height:'100%',width:'100%',borderRadius:3,background:'linear-gradient(to right,#ec4899,#a855f7,#22d3ee)',animation:'pulse 2s ease infinite'}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:7,fontSize:10,fontFamily:'monospace',fontWeight:600,color:'#475569'}}>
          <span>Latency: 6ms</span>
          <span style={{color:'#34d399',display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:5,height:5,borderRadius:'50%',background:'#34d399',display:'inline-block',animation:'pulse 1s ease infinite'}}/>
            256-bit Encrypted
          </span>
        </div>
      </div>
    </aside>
  );
}


/* â”€â”€â”€ ArtifactCard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
const CAT_META = {
  coders:   {icon:IC.code,  bg:'rgba(6,182,212,0.1)',  bdr:'rgba(6,182,212,0.32)',  color:'#67e8f9'},
  creators: {icon:IC.video, bg:'rgba(244,63,94,0.1)',  bdr:'rgba(244,63,94,0.32)',  color:'#fda4af'},
  leaders:  {icon:IC.brief, bg:'rgba(245,158,11,0.1)', bdr:'rgba(245,158,11,0.32)', color:'#fcd34d'},
};

function ArtifactCard({item, onFav, onDelete, onCopy, onDownload, onExpand}){
  const m = CAT_META[item.category] || CAT_META.coders;
  const [hov, setHov] = useState(false);

  return (
    <div className="glass-card" style={{padding:20,display:'flex',flexDirection:'column',gap:12,position:'relative'}}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>

      {/* Category badge + action buttons */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:5,padding:'4px 10px',borderRadius:9,background:m.bg,border:'1px solid '+m.bdr,fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.06em',color:m.color,flexShrink:0}}>
          {m.icon({...SZ.xs,color:'currentColor'})}
          <span>{item.category} Â· {item.source}</span>
        </div>
        <div style={{display:'flex',gap:5,flexShrink:0}}>
          <button onClick={()=>onFav(item.id)} title="Favourite" style={{
            padding:6,borderRadius:9,cursor:'pointer',display:'flex',
            background: item.favorite ? 'rgba(245,158,11,0.18)' : 'rgba(255,255,255,0.05)',
            border: item.favorite ? '1px solid rgba(245,158,11,0.5)' : '1px solid rgba(255,255,255,0.08)',
            color: item.favorite ? '#fcd34d' : '#64748b',
            transition:'all 0.15s',
          }}>
            {IC.star({...SZ.sm,color:'currentColor'}, item.favorite)}
          </button>
          <button onClick={()=>onDelete(item.id)} title="Delete" style={{
            padding:6,borderRadius:9,cursor:'pointer',display:'flex',
            background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',
            color:'#ef4444',opacity: hov ? 1 : 0,transition:'opacity 0.2s',
          }}>
            {IC.trash({...SZ.sm,color:'currentColor'})}
          </button>
        </div>
      </div>

      {/* Title + description */}
      <div>
        <h4 style={{fontWeight:800,fontSize:15,color:'#f1f5f9',marginBottom:5,lineHeight:1.3}}>
          {item.title}
        </h4>
        <p className="clamp2" style={{fontSize:12,color:'#64748b',lineHeight:1.65}}>
          {item.description}
        </p>
      </div>

      {/* Image */}
      {item.image && (
        <div style={{borderRadius:13,overflow:'hidden',height:118,border:'1px solid rgba(255,255,255,0.07)',position:'relative',flexShrink:0}}>
          <img src={item.image} alt={item.title} style={{width:'100%',height:'100%',objectFit:'cover',transition:'transform 0.4s',transform: hov ? 'scale(1.05)' : 'scale(1)'}}/>

        </div>
      )}

      {/* Snippet */}
      {item.snippet && (
        <div className="mono" style={{background:'rgba(2,6,23,0.92)',borderRadius:11,padding:11,fontSize:11,color:'#f9a8d4',border:'1px solid rgba(255,255,255,0.06)',maxHeight:82,overflowY:'auto',lineHeight:1.65}}>
          <pre style={{margin:0,whiteSpace:'pre-wrap',wordBreak:'break-all'}}>{item.snippet}</pre>
        </div>
      )}

      {/* Tags */}
      {item.tags && item.tags.length > 0 && (
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
          {item.tags.map((tag,i)=>(
            <span key={i} className="tag">{tag}</span>
          ))}
        </div>
      )}

      {/* Footer */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:10,borderTop:'1px solid rgba(255,255,255,0.07)',marginTop:'auto',gap:6,flexWrap:'wrap'}}>
        <span className="mono" style={{fontSize:11,color:'#475569',flexShrink:0}}>{item.metadata}</span>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          <button onClick={()=>onDownload(item)} style={{display:'flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:9,fontSize:11,fontWeight:700,color:'#67e8f9',background:'rgba(6,182,212,0.1)',border:'1px solid rgba(6,182,212,0.28)',cursor:'pointer'}}>
            {IC.download({...SZ.xs,color:'currentColor'})} Save
          </button>
          <button onClick={()=>onExpand(item)} style={{display:'flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:9,fontSize:11,fontWeight:700,color:'#d8b4fe',background:'rgba(124,58,237,0.1)',border:'1px solid rgba(124,58,237,0.28)',cursor:'pointer'}}>
            {IC.expand({...SZ.xs,color:'currentColor'})} View
          </button>
          <button onClick={()=>onCopy(item)} style={{display:'flex',alignItems:'center',gap:5,padding:'5px 13px',borderRadius:9,fontSize:11,fontWeight:700,color:'#fff',background:'linear-gradient(135deg,#db2777,#7c3aed)',border:'none',cursor:'pointer',boxShadow:'0 3px 12px rgba(219,39,119,0.28)'}}>
            Copy {IC.copy({...SZ.xs,color:'#fff'})}
          </button>
        </div>
      </div>
    </div>
  );
}

/* â”€â”€â”€ ExpandModal â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */

/* â”€â”€â”€ App â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function App(){
  /* State */
  const [items, setItems] = useState(()=>{
    try{
      const s = localStorage.getItem('cp_v5');
      if(s){ const p=JSON.parse(s); if(Array.isArray(p) && p.length>0) return p; }
    }catch(e){}
    return SEED;
  });
  const [tab,      setTab]      = useState('all');
  const [query,    setQuery]    = useState('');
  const [omni,     setOmni]     = useState(false);
  const [addOpen,  setAddOpen]  = useState(false);
  const [toast,    setToast]    = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [chatOpen, setChatOpen] = useState(false);

  /* Persist to localStorage */
  useEffect(()=>{
    try{ localStorage.setItem('cp_v5', JSON.stringify(items)); }catch(e){}
  },[items]);

  /* Global keyboard shortcuts */
  useEffect(()=>{
    function kd(e){
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
        e.preventDefault(); setOmni(p=>!p);
      }
      if(e.key==='Escape'){
        setOmni(false); setAddOpen(false); setExpanded(null);
      }
    }
    window.addEventListener('keydown', kd);
    return ()=>window.removeEventListener('keydown', kd);
  },[]);

  /* Toast helper */
  function showToast(msg){
    setToast(msg);
    setTimeout(()=>setToast(null), 3000);
  }

  /* Handlers */
  function handleFav(id){
    setItems(p=>p.map(i=>i.id===id ? {...i,favorite:!i.favorite} : i));
    showToast('â­ Favourite updated');
  }
  function handleDelete(id){
    setItems(p=>p.filter(i=>i.id!==id));
    showToast('ðŸ—‘ï¸ Artifact deleted');
  }
  function handleAdd(item){
    setItems(p=>[item,...p]);
    setAddOpen(false);
    showToast('âœ¨ Artifact indexed!');
  }
  function handleDownload(item){
    const text = item.snippet || item.title;
    const blob = new Blob([text],{type:'text/plain'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = item.title.replace(/[^a-z0-9]/gi,'_').toLowerCase()+'.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('â¬‡ï¸ Snippet downloaded!');
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{
      const ok = document.execCommand('copy');
      showToast(ok ? 'ðŸ“‹ Copied to clipboard!' : 'âš ï¸ Copy failed â€” try manually');
    }catch(e){ showToast('âš ï¸ Copy not supported here'); }
    document.body.removeChild(ta);
  }
  function handleCopy(item){
    const text = item.snippet || item.title;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(()=>showToast('ðŸ“‹ Copied to clipboard!'))
        .catch(()=>fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  /* OmniSearch result â†’ open expand modal */
  function handleOmniSelect(item){
    setExpanded(item);
  }

  /* Filtered items */
  const filtered = useMemo(()=>{
    const q = query.trim().toLowerCase();
    return items.filter(item=>{
      const matchTab = tab==='all' || item.category===tab;
      const matchQ   = !q ||
        item.title.toLowerCase().includes(q) ||
        item.description.toLowerCase().includes(q) ||
        item.source.toLowerCase().includes(q) ||
        (item.snippet && item.snippet.toLowerCase().includes(q)) ||
        item.tags.some(t=>t.toLowerCase().includes(q));
      return matchTab && matchQ;
    });
  },[items, tab, query]);

  const feedLabel = tab==='all' ? 'All Workspace Streams' : {
    coders:'Coders Workspace', creators:'Creators Vault', leaders:'Executive Suite'
  }[tab];

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>

      {/* Toast */}
      {toast && <Toast msg={toast}/>}

      {/* OmniSearch overlay */}
      {omni && (
        <OmniSearch
          items={items} query={query} setQuery={setQuery}
          onClose={()=>setOmni(false)}
          onSelect={handleOmniSelect}
        />
      )}

      {/* Add artifact modal */}
      {addOpen && <AddItemModal onClose={()=>setAddOpen(false)} onAdd={handleAdd}/>}

      {/* Expand / detail modal */}
      {expanded && (
        <ExpandModal
          item={expanded}
          onClose={()=>setExpanded(null)}
          onCopy={handleCopy}
          onDownload={handleDownload}
        />
      )}

      {/* Header */}
      <Header onAdd={()=>setAddOpen(true)} onSearch={()=>setOmni(true)}/>

      {/* Main content */}
      <main style={{flex:1,maxWidth:1320,width:'100%',margin:'0 auto',padding:'28px 20px'}}>
        <div className="main-grid">
          {/* Sidebar */}
          <Sidebar items={items} active={tab} setActive={setTab}/>

          {/* Feed */}
          <section style={{display:'flex',flexDirection:'column',gap:20,minWidth:0}}>

            {/* Search banner */}
            <div className="glass" style={{borderRadius:22,padding:26,position:'relative',overflow:'hidden',border:'1px solid rgba(236,72,153,0.22)'}}>
              <div style={{position:'absolute',right:-50,top:-50,width:220,height:220,borderRadius:'50%',background:'radial-gradient(circle,rgba(236,72,153,0.2),transparent)',filter:'blur(40px)',pointerEvents:'none'}}/>
              <h2 className="grad-text" style={{fontWeight:900,fontSize:22,marginBottom:5}}>Infinite Context Engine</h2>
              <p style={{fontSize:13,color:'#64748b',marginBottom:16,fontWeight:500}}>Instant retrieval across your entire digital workspace.</p>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',display:'flex'}}>
                  {IC.search({...SZ.md,color:'#f472b6'})}
                </span>
                <input
                  type="text"
                  value={query}
                  onChange={e=>setQuery(e.target.value)}
                  placeholder="Search by title, tag, keyword or platform…"
                  className="field"
                  style={{paddingLeft:42,fontSize:14,borderRadius:14,padding:'13px 14px 13px 42px'}}
                />
                {query && (
                  <button onClick={()=>setQuery('')} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',fontSize:11,fontWeight:700,color:'#f472b6',background:'none',border:'none',cursor:'pointer'}}>
                    Clear
                  </button>
                )}
              </div>
            </div>

            {/* Feed header */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 4px'}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:'linear-gradient(to right,#f472b6,#a78bfa)',display:'inline-block'}}/>
                <span style={{fontSize:13,fontWeight:800,color:'#e2e8f0'}}>{feedLabel}</span>
              </div>
              <span style={{fontSize:11,fontFamily:'monospace',fontWeight:700,padding:'3px 12px',borderRadius:20,background:'rgba(236,72,153,0.08)',border:'1px solid rgba(236,72,153,0.22)',color:'#f472b6'}}>
                {filtered.length} artifact{filtered.length!==1?'s':''}
              </span>
            </div>

            {/* Cards or empty state */}
            {filtered.length===0 ? (
              <div className="glass" style={{borderRadius:22,padding:'56px 20px',textAlign:'center',border:'1px dashed rgba(236,72,153,0.2)'}}>
                <div style={{display:'flex',justifyContent:'center',marginBottom:14}}>
                  {IC.inbox({width:44,height:44,color:'#ec4899',display:'block'})}
                </div>
                <p style={{fontWeight:700,color:'#cbd5e1',fontSize:14,marginBottom:4}}>No artifacts found</p>
                <p style={{fontSize:12,color:'#475569'}}>Try a different search or add a new artifact.</p>
              </div>
            ) : (
              <div className="cards-grid">
                {filtered.map(item=>(
                  <ArtifactCard
                    key={item.id}
                    item={item}
                    onFav={handleFav}
                    onDelete={handleDelete}
                    onCopy={handleCopy}
                    onDownload={handleDownload}
                    onExpand={setExpanded}
                  />
                ))}
              </div>
            )}

          </section>
        </div>
      </main>

      {/* Chat FAB button */}
      <button
        onClick={()=>setChatOpen(p=>!p)}
        title="Open AI Chat"
        style={{
          position:'fixed',bottom:24,left:24,zIndex:90,
          width:52,height:52,borderRadius:'50%',
          background: chatOpen
            ? 'linear-gradient(135deg,#7c3aed,#ec4899)'
            : 'linear-gradient(135deg,#ec4899,#7c3aed)',
          border:'none',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',
          boxShadow:'0 6px 24px rgba(236,72,153,0.55)',
          transition:'transform 0.2s, box-shadow 0.2s',
        }}
        onMouseEnter={e=>{e.currentTarget.style.transform='scale(1.12)';e.currentTarget.style.boxShadow='0 8px 30px rgba(236,72,153,0.7)';}}
        onMouseLeave={e=>{e.currentTarget.style.transform='scale(1)';e.currentTarget.style.boxShadow='0 6px 24px rgba(236,72,153,0.55)';}}
      >
        {chatOpen ? IC.x({...SZ.lg,color:'#fff'}) : IC.chat({...SZ.lg,color:'#fff'})}
      </button>

      {/* Chat panel */}
      {chatOpen && <ChatPanel onClose={()=>setChatOpen(false)} items={items}/>}

    </div>
  );
}


/* ─── Mount ──────────────────────────────────────────────────────────────── */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
