<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextPulse — Lumina OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030014;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Glass cards */
        .glass {
            background: linear-gradient(135deg, rgba(20,18,50,0.82) 0%, rgba(10,8,30,0.94) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(236,72,153,0.2);
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        }
        .glass-hover {
            background: linear-gradient(135deg, rgba(20,18,50,0.82) 0%, rgba(10,8,30,0.94) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(236,72,153,0.2);
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        .glass-hover:hover {
            border-color: rgba(236,72,153,0.5);
            box-shadow: 0 24px 60px rgba(236,72,153,0.18);
            transform: translateY(-3px);
        }

        /* Ambient orbs */
        .orb {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            border-radius: 9999px;
        }
        .orb1 {
            top: -10%; left: 5%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168,85,247,0.35) 0%, transparent 70%);
            filter: blur(80px);
            animation: float1 12s ease-in-out infinite;
        }
        .orb2 {
            top: 30%; right: 0%;
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(236,72,153,0.28) 0%, transparent 70%);
            filter: blur(90px);
            animation: float2 16s ease-in-out infinite;
        }
        .orb3 {
            bottom: -10%; left: 25%;
            width: 650px; height: 650px;
            background: radial-gradient(circle, rgba(6,182,212,0.22) 0%, transparent 70%);
            filter: blur(100px);
            animation: float3 20s ease-in-out infinite;
        }

        @keyframes float1 {
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(50px,-70px); }
        }
        @keyframes float2 {
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(-60px,50px); }
        }
        @keyframes float3 {
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(40px,60px); }
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(14px); }
            to   { opacity:1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity:0; transform: scale(0.95); }
            to   { opacity:1; transform: scale(1); }
        }
        @keyframes pulse-bar {
            0%,100% { opacity:1; }
            50%     { opacity:0.5; }
        }

        .anim-slide-up { animation: slideUp 0.3s ease both; }
        .anim-pop-in   { animation: popIn  0.25s cubic-bezier(0.16,1,0.3,1) both; }

        /* Inputs */
        .field {
            width: 100%;
            background: rgba(2,6,23,0.92);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 13px;
            color: #f1f5f9;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .field:focus { border-color: rgba(236,72,153,0.65); }
        select.field { cursor: pointer; }
        textarea.field { resize: vertical; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030014; }
        ::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(236,72,153,0.6); }

        /* Line clamp */
        .clamp2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

        /* Overlay backdrop */
        .overlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            animation: fadeOverlay 0.2s ease both;
        }
        .overlay-top { align-items: flex-start; padding-top: 80px; }
        @keyframes fadeOverlay {
            from { opacity:0; }
            to   { opacity:1; }
        }
    </style>
</head>

function Toast({ msg }) {

// ── Chatbot Drawer Component ─────────────────────────────────────────────────
function ChatbotDrawer({ isOpen, onClose, items }) {
    const [messages, setMessages] = useState([
        { sender: 'bot', text: 'Hello! I am your Lumina AI assistant. Ask me anything about your loaded artifacts or workspace.' }
    ]);
    const [input, setInput] = useState('');
    const chatEndRef = useRef(null);

    useEffect(() => {
        if (isOpen) {
            chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
    }, [messages, isOpen]);

    if (!isOpen) return null;

    const handleSend = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        const userText = input.trim();
        const newMessages = [...messages, { sender: 'user', text: userText }];
        setMessages(newMessages);
        setInput('');

        // Simple local intelligent context response simulation
        setTimeout(() => {
            let botReply = "I've searched your current workspace streams. ";
            const lower = userText.toLowerCase();
            const matched = items.filter(item => 
                item.title.toLowerCase().includes(lower) || 
                item.description.toLowerCase().includes(lower) ||
                (item.snippet && item.snippet.toLowerCase().includes(lower))
            );

            if (matched.length > 0) {
                botReply += `Found relevant artifact: "${matched[0].title}" — ${matched[0].description}`;
            } else {
                botReply += "No exact snippet matched your query directly, but all systems are indexed and active.";
            }
            setMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
        }, 500);
    };

    return (
        <div className="overlay" onClick={onClose} style={{justifyContent:'flex-end', padding:0}}>
            <div className="glass anim-slide-up" onClick={(e) => e.stopPropagation()} style={{
                width:'100%', maxWidth:'400px', height:'100%', display:'flex', flexDirection:'column',
                borderLeft:'1px solid rgba(236,72,153,0.3)', borderTop:'none', borderBottom:'none', borderRight:'none'
            }}>
                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'20px', borderBottom:'1px solid rgba(255,255,255,0.08)'}}>
                    <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
                        <div style={{width:'32px', height:'32px', borderRadius:'10px', background:'linear-gradient(135deg,#ec4899,#7c3aed)', display:'flex', alignItems:'center', justifyContent:'center'}}>
                            {icons.sparkle('w-4 h-4 text-white')}
                        </div>
                        <span style={{fontWeight:800, fontSize:'14px', color:'#fff'}}>Neural Assistant</span>
                    </div>
                    <button onClick={onClose} style={{padding:'6px', borderRadius:'10px', background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.08)', cursor:'pointer', color:'#94a3b8', display:'flex'}}>
                        {icons.x('w-4 h-4')}
                    </button>
                </div>
                
                <div style={{flex:1, overflowY:'auto', padding:'20px', display:'flex', flexDirection:'column', gap:'12px'}}>
                    {messages.map((m, idx) => (
                        <div key={idx} style={{
                            alignSelf: m.sender === 'user' ? 'flex-end' : 'flex-start',
                            maxWidth:'85%', padding:'10px 14px', borderRadius:'14px',
                            background: m.sender === 'user' ? 'linear-gradient(135deg,#db2777,#7c3aed)' : 'rgba(255,255,255,0.06)',
                            color:'#fff', fontSize:'13px', lineHeight:1.4,
                            border: m.sender === 'bot' ? '1px solid rgba(255,255,255,0.1)' : 'none'
                        }}>
                            {m.text}
                        </div>
                    ))}
                    <div ref={chatEndRef} />
                </div>

                <form onSubmit={handleSend} style={{padding:'16px', borderTop:'1px solid rgba(255,255,255,0.08)', display:'flex', gap:'8px'}}>
                    <input 
                        type="text" 
                        value={input} 
                        onChange={(e) => setInput(e.target.value)} 
                        placeholder="Ask chatbot anything..." 
                        className="field" 
                    />
                    <button type="submit" style={{padding:'0 16px', borderRadius:'10px', background:'linear-gradient(135deg,#db2777,#7c3aed)', color:'#fff', border:'none', cursor:'pointer', fontWeight:700, fontSize:'12px'}}>Send</button>
                </form>
            </div>
        </div>
    );
}

// ── OmniSearch Modal ─────────────────────────────────────────────────────────
function OmniSearch({ items, query, setQuery, onClose }) {
    const ref = useRef(null);
    useEffect(() => { setTimeout(() => ref.current && ref.current.focus(), 40); }, []);

    const results = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return items.slice(0, 6);
        return items.filter(function(i) {
            return i.title.toLowerCase().includes(q)
                || i.description.toLowerCase().includes(q)
                || i.source.toLowerCase().includes(q)
                || i.tags.some(function(t) { return t.toLowerCase().includes(q); })
                || (i.snippet && i.snippet.toLowerCase().includes(q));
        });
    }, [items, query]);

    return (
        <div className="overlay overlay-top" onClick={onClose}>
            <div className="glass anim-pop-in" onClick={function(e){ e.stopPropagation(); }} style={{
                width:'100%', maxWidth:'560px', borderRadius:'24px', padding:'24px',
                border:'1px solid rgba(236,72,153,0.45)'
            }}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:'16px',borderBottom:'1px solid rgba(255,255,255,0.08)',marginBottom:'16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                        {icons.search('w-4 h-4 text-pink-400')}
                        <span style={{fontWeight:800,fontSize:'14px',color:'#fff'}}>Omni-Search</span>
                    </div>
                    <button onClick={onClose} style={{fontSize:'11px',fontWeight:700,color:'#94a3b8',padding:'4px 10px',borderRadius:'8px',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',cursor:'pointer'}}>ESC</button>
                </div>
                <div style={{position:'relative',marginBottom:'14px'}}>
                    <div style={{position:'absolute',left:'12px',top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>
                        {icons.search('w-4 h-4 text-pink-400')}
                    </div>
                    <input ref={ref} type="text" value={query} onChange={function(e){ setQuery(e.target.value); }}
                        placeholder="Search across all workspaces..."
                        className="field" style={{paddingLeft:'38px'}} />
                </div>
                <div style={{maxHeight:'260px',overflowY:'auto'}}>
                    {results.length === 0 ? (
                        <p style={{textAlign:'center',color:'#64748b',fontSize:'12px',padding:'24px 0'}}>No results found.</p>
                    ) : results.map(function(item) {
                        return (
                            <div key={item.id} onClick={function(){ setQuery(item.title); onClose(); }}
                                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',borderRadius:'12px',cursor:'pointer',border:'1px solid transparent',marginBottom:'4px',transition:'all 0.15s'}}
                                onMouseEnter={function(e){ e.currentTarget.style.background='rgba(255,255,255,0.05)'; e.currentTarget.style.borderColor='rgba(236,72,153,0.2)'; }}
                                onMouseLeave={function(e){ e.currentTarget.style.background='transparent'; e.currentTarget.style.borderColor='transparent'; }}>
                                <div>
                                    <p style={{fontWeight:700,fontSize:'12px',color:'#f1f5f9'}}>{item.title}</p>
                                    <p style={{fontSize:'10px',color:'#64748b',marginTop:'2px'}}>{item.source} · {item.category}</p>
                                </div>
                                <span style={{fontSize:'10px',fontFamily:'monospace',color:'#f472b6',background:'rgba(236,72,153,0.1)',padding:'2px 8px',borderRadius:'20px',border:'1px solid rgba(236,72,153,0.2)',flexShrink:0}}>Open</span>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
}

// ── AddItemModal ─────────────────────────────────────────────────────────────
function AddItemModal({ onClose, onAdd }) {
    const [title,    setTitle]    = useState('');
    const [category, setCat]      = useState('coders');
    const [source,   setSource]   = useState('');
    const [desc,     setDesc]     = useState('');
    const [snippet,  setSnippet] = useState('');
    const [tags,     setTags]     = useState('');
    const [image,    setImage]    = useState('');
    const [err,      setErr]      = useState('');

    function submit(e) {
        e.preventDefault();
        if (!title.trim()) { setErr('Title is required.'); return; }
        setErr('');
        var parsedTags = tags
            ? tags.split(',').map(function(t) {
                var c = t.trim();
                return c.startsWith('#') ? c : '#' + c;
              }).filter(function(t){ return t.length > 1; })
            : ['#Custom'];
        onAdd({
            id: 'ctx-' + Date.now(),
            title: title.trim(),
            category: category,
            source: source.trim() || 'Manual Entry',
            image: image.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80',
            snippet: snippet.trim(),
            description: desc.trim() || 'No description provided.',
            metadata: 'Created: Just now',
            favorite: false,
            tags: parsedTags
        });
    }

    var lbl = { display:'block', fontSize:'10px', fontWeight:800, textTransform:'uppercase', letterSpacing:'0.08em', color:'#f472b6', marginBottom:'6px' };

    return (
        <div className="overlay" onClick={onClose}>
            <div className="glass anim-pop-in" onClick={function(e){ e.stopPropagation(); }} style={{
                width:'100%', maxWidth:'500px', borderRadius:'24px', padding:'24px',
                border:'1px solid rgba(236,72,153,0.4)', maxHeight:'92vh', overflowY:'auto'
            }}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:'16px',borderBottom:'1px solid rgba(255,255,255,0.08)',marginBottom:'20px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                        <div style={{width:'32px',height:'32px',borderRadius:'10px',background:'linear-gradient(135deg,#ec4899,#7c3aed)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                            {icons.sparkle('w-4 h-4 text-white')}
                        </div>
                        <span style={{fontWeight:800,fontSize:'14px',color:'#fff'}}>Add Context Artifact</span>
                    </div>
                    <button onClick={onClose} style={{padding:'6px',borderRadius:'10px',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',cursor:'pointer',color:'#94a3b8',display:'flex'}}>
                        {icons.x('w-4 h-4')}
                    </button>
                </div>

                {err && (
                    <div style={{marginBottom:'14px',padding:'10px 14px',background:'rgba(239,68,68,0.12)',border:'1px solid rgba(239,68,68,0.35)',borderRadius:'10px',color:'#fca5a5',fontSize:'12px',fontWeight:600}}>
                        {err}
                    </div>
                )}

                <form onSubmit={submit}>
                    <div style={{marginBottom:'14px'}}>
                        <label style={lbl}>Title *</label>
                        <input type="text" value={title} onChange={function(e){setTitle(e.target.value);}} placeholder="e.g. JWT Auth Middleware" className="field" />
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'14px'}}>
                        <div>
                            <label style={lbl}>Workspace</label>
                            <select value={category} onChange={function(e){setCat(e.target.value);}} className="field">
                                <option value="coders">Coders</option>
                                <option value="creators">Creators</option>
                                <option value="leaders">Leaders</option>
                            </select>
                        </div>
                        <div>
                            <label style={lbl}>Source</label>
                            <input type="text" value={source} onChange={function(e){setSource(e.target.value);}} placeholder="GitHub, Notion..." className="field" />
                        </div>
                    </div>
                    <div style={{marginBottom:'14px'}}>
                        <label style={lbl}>Description</label>
                        <textarea rows="2" value={desc} onChange={function(e){setDesc(e.target.value);}} placeholder="Brief summary..." className="field" />
                    </div>
                    <div style={{marginBottom:'14px'}}>
                        <label style={lbl}>Code / Snippet</label>
                        <textarea rows="3" value={snippet} onChange={function(e){setSnippet(e.target.value);}} placeholder="const token = req.headers.authorization;" className="field mono" style={{fontSize:'12px',color:'#f9a8d4'}} />
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'20px'}}>
                        <div>
                            <label style={lbl}>Tags (comma-separated)</label>
                            <input type="text" value={tags} onChange={function(e){setTags(e.target.value);}} placeholder="#Auth, #Security" className="field" />
                        </div>
                        <div>
                            <label style={lbl}>Image URL</label>
                            <input type="text" value={image} onChange={function(e){setImage(e.target.value);}} placeholder="https://..." className="field" />
                        </div>
                    </div>
                    <div style={{display:'flex',justifyContent:'flex-end',gap:'10px'}}>
                        <button type="button" onClick={onClose} style={{padding:'8px 16px',borderRadius:'10px',fontSize:'12px',fontWeight:700,background:'rgba(255,255,255,0.05)',color:'#94a3b8',border:'1px solid rgba(255,255,255,0.08)',cursor:'pointer'}}>Cancel</button>
                        <button type="submit" style={{padding:'8px 18px',borderRadius:'10px',fontSize:'12px',fontWeight:700,background:'linear-gradient(135deg,#db2777,#7c3aed)',color:'#fff',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',boxShadow:'0 4px 16px rgba(219,39,119,0.35)'}}>
                            {icons.plus('w-3.5 h-3.5')}
                            Index Artifact
                        </button>
                    </div>
                </form>
            </div>
        </div>
    );
}

// ── Header Component ─────────────────────────────────────────────────────────
function Header({ onAdd, onSearch, onOpenChat }) {
    return (
        <header style={{
            position:'sticky', top:0, zIndex:40,
            background:'rgba(3,0,20,0.88)', backdropFilter:'blur(28px)',
            borderBottom:'1px solid rgba(255,255,255,0.07)'
        }}>
            <div style={{maxWidth:'1280px',margin:'0 auto',padding:'0 20px',height:'66px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>

                {/* Logo */}
                <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                    <div style={{width:'40px',height:'40px',borderRadius:'14px',background:'linear-gradient(135deg,#ec4899,#7c3aed,#6366f1)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 20px rgba(236,72,153,0.4)'}}>
                        {icons.zap('w-5 h-5 text-white')}
                    </div>
                    <div>
                        <div style={{fontWeight:800,fontSize:'18px',lineHeight:1.2,background:'linear-gradient(to right,#fff,#f9a8d4,#d8b4fe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
                            ContextPulse
                        </div>
                        <div style={{fontSize:'9px',fontWeight:900,textTransform:'uppercase',letterSpacing:'0.1em',padding:'1px 8px',borderRadius:'20px',background:'rgba(236,72,153,0.12)',color:'#f9a8d4',border:'1px solid rgba(236,72,153,0.3)',display:'inline-block'}}>
                            Lumina OS v5
                        </div>
                    </div>
                </div>

                {/* Actions */}
                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                    <button onClick={onOpenChat} style={{display:'flex',alignItems:'center',gap:'6px',padding:'8px 14px',borderRadius:'12px',fontSize:'12px',fontWeight:700,color:'#f9a8d4',background:'rgba(236,72,153,0.1)',border:'1px solid rgba(236,72,153,0.3)',cursor:'pointer'}}>
                        {icons.message('w-4 h-4')}
                        AI Chatbot
                    </button>
                    <button onClick={onAdd} style={{display:'flex',alignItems:'center',gap:'6px',padding:'8px 16px',borderRadius:'12px',fontSize:'12px',fontWeight:700,color:'#fff',background:'linear-gradient(135deg,#db2777,#7c3aed)',border:'none',cursor:'pointer',boxShadow:'0 4px 16px rgba(219,39,119,0.35)'}}>
                        {icons.sparkle('w-3.5 h-3.5')}
                        Add Context
                    </button>
                    <button onClick={onSearch} style={{display:'flex',alignItems:'center',gap:'8px',padding:'8px 14px',borderRadius:'12px',fontSize:'12px',fontWeight:600,color:'#cbd5e1',background:'rgba(15,10,40,0.8)',border:'1px solid rgba(255,255,255,0.1)',cursor:'pointer'}}>
                        {icons.search('w-4 h-4 text-pink-400')}
                        <span>Search</span>
                        <kbd style={{fontSize:'10px',fontFamily:'monospace',padding:'1px 6px',borderRadius:'5px',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.12)',color:'#f472b6'}}>⌘K</kbd>
                    </button>
                </div>
            </div>
        </header>
    );
}

// ── Sidebar Component ────────────────────────────────────────────────────────
function Sidebar({ items, active, setActive }) {
    var tabs = [
        { id:'all',      label:'All Streams',      icon:icons.grid,      color:'#f472b6' },
        { id:'coders',   label:'Coders Workspace', icon:icons.code,      color:'#22d3ee' },
        { id:'creators', label:'Creators Vault',   icon:icons.video,     color:'#fb7185' },
        { id:'leaders',  label:'Executive Suite',  icon:icons.briefcase, color:'#fbbf24' },
    ];

    function count(id) {
        return id === 'all' ? items.length : items.filter(function(i){ return i.category === id; }).length;
    }

    var activeBgs = {
        all:      'linear-gradient(135deg,rgba(219,39,119,0.22),rgba(124,58,237,0.22))',
        coders:   'linear-gradient(135deg,rgba(8,145,178,0.22),rgba(37,99,235,0.22))',
        creators: 'linear-gradient(135deg,rgba(225,29,72,0.22),rgba(219,39,119,0.22))',
        leaders:  'linear-gradient(135deg,rgba(217,119,6,0.22),rgba(234,88,12,0.22))',
    };
    var activeBorders = { all:'rgba(236,72,153,0.45)', coders:'rgba(6,182,212,0.45)', creators:'rgba(244,63,94,0.45)', leaders:'rgba(245,158,11,0.45)' };

    return (
        <aside style={{gridColumn:'span 1'}}>
            <div className="glass" style={{borderRadius:'22px',padding:'16px',marginBottom:'16px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'6px',padding:'0 4px',marginBottom:'12px'}}>
                    {icons.layers('w-3.5 h-3.5 text-pink-400')}
                    <span style={{fontSize:'10px',fontWeight:900,textTransform:'uppercase',letterSpacing:'0.08em',color:'#f472b6'}}>Workspaces</span>
                </div>
                <nav style={{display:'flex', flexDirection:'column', gap:'6px'}}>
                    {tabs.map(function(tab) {
                        var isActive = active === tab.id;
                        return (
                            <button key={tab.id} onClick={function(){ setActive(tab.id); }}
                                style={{
                                    width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
                                    padding:'10px 12px', borderRadius:'14px', cursor:'pointer', border:'1px solid',
                                    background: isActive ? activeBgs[tab.id] : 'transparent',
                                    borderColor: isActive ? activeBorders[tab.id] : 'transparent',
                                    transition:'all 0.2s'
                                }}>
                                <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
                                    <div style={{color: tab.color}}>
                                        {tab.icon('w-4 h-4')}
                                    </div>
                                    <span style={{fontSize:'13px', fontWeight:isActive ? 700 : 500, color: isActive ? '#fff' : '#94a3b8'}}>{tab.label}</span>
                                </div>
                                <span style={{fontSize:'10px', fontWeight:700, padding:'2px 8px', borderRadius:'10px', background:'rgba(255,255,255,0.06)', color:'#cbd5e1'}}>
                                    {count(tab.id)}
                                </span>
                            </button>
                        );
                    })}
                </nav>
            </div>

            <div className="glass" style={{borderRadius:'22px', padding:'18px'}}>
                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px'}}>
                    <span style={{fontSize:'10px', fontWeight:900, textTransform:'uppercase', letterSpacing:'0.08em', color:'#f472b6'}}>Neural Sync Active</span>
                    <span style={{fontSize:'9px', color:'#34d399', fontWeight:700}}>LIVE</span>
                </div>
                <p style={{fontSize:'11px', color:'#94a3b8', lineHeight:1.4, marginBottom:'12px'}}>Live semantic indexing across GitHub, Drive, Notion & Slack.</p>
                <div style={{width:'100%', height:'6px', background:'rgba(255,255,255,0.1)', borderRadius:'3px', overflow:'hidden'}}>
                    <div style={{width:'78%', height:'100%', background:'linear-gradient(90deg,#ec4899,#06b6d4)', borderRadius:'3px'}}></div>
                </div>
                <div style={{display:'flex', justifyContent:'space-between', marginTop:'8px', fontSize:'9px', color:'#64748b', fontFamily:'monospace'}}>
                    <span>Latency: 6ms</span>
                    <span>256-bit Encrypted</span>
                </div>
            </div>
        </aside>
    );
}

// ── Main Dashboard App Component ─────────────────────────────────────────────
function App() {
    const [items, setItems]       = useState(SEED);
    const [active, setActive]     = useState('all');
    const [searchQuery, setSearchQuery] = useState('');
    const [isSearchOpen, setSearchOpen] = useState(false);
    const [isAddOpen, setAddOpen] = useState(false);
    const [isChatOpen, setChatOpen] = useState(false);
    const [toastMsg, setToastMsg] = useState(null);

    const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
    };

    const handleCopy = (text) => {
        if (!text) {
            triggerToast('No content available to copy.');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            triggerToast('Snippet copied to clipboard successfully!');
        }).catch(() => {
            triggerToast('Failed to copy to clipboard.');
        });
    };

    const toggleFavorite = (id) => {
        setItems(prev => prev.map(i => i.id === id ? {...i, favorite: !i.favorite} : i));
        triggerToast('Artifact bookmark updated.');
    };

    const deleteItem = (id) => {
        setItems(prev => prev.filter(i => i.id !== id));
        triggerToast('Artifact removed from stream.');
    };

    const filteredItems = useMemo(() => {
        let list = items;
        if (active !== 'all') {
            list = list.filter(i => i.category === active);
        }
        if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            list = list.filter(i => i.title.toLowerCase().includes(q) || i.description.toLowerCase().includes(q) || i.source.toLowerCase().includes(q));
        }
        return list;
    }, [items, active, searchQuery]);

    return (
        <div style={{minHeight:'100vh', display:'flex', flexDirection:'column'}}>
            <Header 
                onAdd={() => setAddOpen(true)} 
                onSearch={() => setSearchOpen(true)} 
                onOpenChat={() => setChatOpen(true)} 
            />

            <main style={{maxWidth:'1280px', width:'100%', margin:'0 auto', padding:'24px 20px', flex:1}}>
                <div style={{display:'grid', gridTemplateColumns:'260px 1fr', gap:'24px', alignItems:'start'}}>
                    
                    <Sidebar items={items} active={active} setActive={setActive} />

                    <section style={{display:'flex', flexDirection:'column', gap:'20px'}}>
                        {/* Stream Controls Header */}
                        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                            <h2 style={{fontSize:'16px', fontWeight:800, color:'#fff', textTransform:'uppercase', letterSpacing:'0.05em'}}>
                                {active === 'all' ? 'All Workspace Streams' : `${active.toUpperCase()} Stream`}
                            </h2>
                            <div style={{fontSize:'12px', color:'#94a3b8'}}>
                                Showing <b>{filteredItems.length}</b> artifacts
                            </div>
                        </div>

                        {/* Artifact Grid */}
                        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))', gap:'20px'}}>
                            {filteredItems.length === 0 ? (
                                <div className="glass" style={{gridColumn:'1 / -1', padding:'48px', textAlign:'center', borderRadius:'20px'}}>
                                    <p style={{color:'#94a3b8', fontSize:'14px', marginBottom:'12px'}}>No context artifacts found in this stream.</p>
                                    <button onClick={() => setAddOpen(true)} style={{padding:'8px 16px', borderRadius:'10px', background:'linear-gradient(135deg,#db2777,#7c3aed)', color:'#fff', border:'none', cursor:'pointer', fontWeight:700, fontSize:'12px'}}>Add First Artifact</button>
                                </div>
                            ) : filteredItems.map(item => (
                                <div key={item.id} className="glass glass-hover" style={{borderRadius:'20px', overflow:'hidden', display:'flex', flexDirection:'column'}}>
                                    <div style={{position:'relative', height:'140px', background:'#0b0820'}}>
                                        <img src={item.image} alt={item.title} style={{width:'100%', height:'100%', objectFit:'cover', opacity:0.85}} />
                                        <div style={{position:'absolute', inset:0, background:'linear-gradient(to top, rgba(10,8,30,0.95), transparent)'}}></div>
                                        <span style={{position:'absolute', top:'10px', left:'10px', fontSize:'9px', fontWeight:800, textTransform:'uppercase', padding:'3px 8px', borderRadius:'20px', background:'rgba(3,0,20,0.8)', color:'#f472b6', border:'1px solid rgba(236,72,153,0.3)'}}>
                                            {item.source}
                                        </span>
                                        <button onClick={() => toggleFavorite(item.id)} style={{position:'absolute', top:'10px', right:'10px', background:'rgba(3,0,20,0.8)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:'50%', width:'28px', height:'28px', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color: item.favorite ? '#fbbf24' : '#94a3b8'}}>
                                            {icons.star('w-3.5 h-3.5', item.favorite)}
                                        </button>
                                    </div>
                                    <div style={{padding:'16px', flex:1, display:'flex', flexDirection:'column', justifyContent:'space-between'}}>
                                        <div>
                                            <h3 style={{fontSize:'14px', fontWeight:800, color:'#f8fafc', marginBottom:'6px'}}>{item.title}</h3>
                                            <p className="clamp2" style={{fontSize:'12px', color:'#94a3b8', lineHeight:1.4, marginBottom:'12px'}}>{item.description}</p>
                                            
                                            {item.snippet && (
                                                <div className="mono" style={{background:'rgba(2,6,23,0.9)', padding:'10px', borderRadius:'10px', fontSize:'11px', color:'#f9a8d4', border:'1px solid rgba(255,255,255,0.06)', marginBottom:'12px', overflowX:'auto', whiteSpace:'pre-wrap'}}>
                                                    {item.snippet}
                                                </div>
                                            )}

                                            <div style={{display:'flex', flexWrap:'wrap', gap:'4px', marginBottom:'14px'}}>
                                                {item.tags.map((t, idx) => (
                                                    <span key={idx} style={{fontSize:'9px', fontFamily:'monospace', color:'#f472b6', background:'rgba(236,72,153,0.1)', padding:'2px 6px', borderRadius:'6px', border:'1px solid rgba(236,72,153,0.2)'}}>{t}</span>
                                                ))}
                                            </div>
                                        </div>

                                        <div style={{display:'flex', alignItems:'center', justifyContent:'between', paddingTop:'12px', borderTop:'1px solid rgba(255,255,255,0.06)'}}>
                                            <span style={{fontSize:'10px', color:'#64748b', flex:1}}>{item.metadata}</span>
                                            <div style={{display:'flex', gap:'6px'}}>
                                                <button onClick={() => handleCopy(item.snippet || item.description)} style={{display:'flex', alignItems:'center', gap:'4px', padding:'6px 12px', borderRadius:'8px', background:'linear-gradient(135deg,#db2777,#7c3aed)', color:'#fff', border:'none', cursor:'pointer', fontSize:'11px', fontWeight:700}}>
                                                    {icons.copy('w-3.5 h-3.5')}
                                                    Copy
                                                </button>
                                                <button onClick={() => deleteItem(item.id)} style={{padding:'6px', borderRadius:'8px', background:'rgba(239,68,68,0.1)', border:'1px solid rgba(239,68,68,0.2)', color:'#fca5a5', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}>
                                                    {icons.trash('w-3.5 h-3.5')}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            </main>

            {/* Modals & Overlays */}
            {isSearchOpen && (
                <OmniSearch items={items} query={searchQuery} setQuery={setSearchQuery} onClose={() => setSearchOpen(false)} />
            )}

            {isAddOpen && (
                <AddItemModal onClose={() => setAddOpen(false)} onAdd={(newItem) => { setItems(prev => [newItem, ...prev]); setAddOpen(false); triggerToast('Context artifact added successfully.'); }} />
            )}

            <ChatbotDrawer isOpen={isChatOpen} onClose={() => setChatOpen(false)} items={items} />

            {toastMsg && <Toast msg={toastMsg} />}
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>

</body>
</html>
